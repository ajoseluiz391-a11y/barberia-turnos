<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>barberia-turnos | jose-c3350</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #141414;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .caja {
      background-color: #222222;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 4px;
      text-align: center;
    }
    .subtitulo {
      text-align: center;
      color: #bbbbbb;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: none;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      background-color: #e5a93c;
      color: #141414;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }
    .mensaje {
      margin-top: 15px;
      padding: 10px;
      background-color: #1e3a2f;
      border-radius: 6px;
      display: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Barbería - Turnos</h1>
    <p class="subtitulo">Barbero: jose-c3350</p>

    <form id="formTurno">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" required placeholder="Ej. Luis">

      <label for="servicio">Servicio</label>
      <select id="servicio">
        <option value="Corte de cabello">Corte de cabello</option>
        <option value="Perfilado de barba">Perfilado de barba</option>
        <option value="Corte y barba">Corte y barba</option>
      </select>

      <label for="hora">Hora preferida</label>
      <input type="time" id="hora" required>

      <button type="submit">Pedir turno</button>
    </form>

    <div class="mensaje" id="mensaje"></div>
  </div>

  <script>
    const form = document.getElementById("formTurno");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value;
      const servicio = document.getElementById("servicio").value;
      const hora = document.getElementById("hora").value;

      mensaje.style.display = "block";
      mensaje.textContent = `Listo, ${nombre}. Solicitud registrada para "${servicio}" a las ${hora}.`;
      form.reset();
    });
  </script>
</body>
</html>
